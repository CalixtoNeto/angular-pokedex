<div class="card pokemon-card bg-{{ mainType() }}">
  <div class="card-body">
    <span class="number">{{ number() }}</span>
    <h3 class="card-title">{{ pokemon().name | titlecase }}</h3>
    <div class="types">
      @for (type of pokemon().types; track type) {
        <span class="badge rounded-pill bg-{{ type }}">{{ type | typeLabel }}</span>
      }
    </div>
    <img [src]="pokemon().image" [alt]="pokemon().name" class="artwork" loading="lazy" decoding="async" />
  </div>
</div>
