<div class="container my-5">
  <div class="row">
    <div class="col-xl-8 offset-xl-2">
      <div class="row">
        <h1 class="mb-4 text-center" i18n="App title@@list.title">Pokedex</h1>
        <div class="row mb-4">
          <div class="col-sm text-center">
            @for (region of store.regions(); track region.id) {
              <button class="badge border rounded-pill me-1 bg-ice" (click)="store.selectRegion(region.id)">
                {{ region.label | titlecase }}
              </button>
            }
          </div>
        </div>
        <div class="form-group">
          <input
            type="text"
            class="form-control mb-4"
            placeholder="Search"
            i18n-placeholder="Search by Pokémon name@@list.search"
            id="listSearch"
            [value]="store.search()"
            (input)="onSearch($event)"
          />
        </div>
        @for (pokemon of store.visiblePokemons(); track pokemon.id) {
          <div class="col-6 mb-3">
            <a class="pokemon-link" [routerLink]="['/pokemon', pokemon.name]">
              <app-pokemon-card [pokemon]="pokemon" />
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</div>
