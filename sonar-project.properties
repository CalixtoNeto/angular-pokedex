# Análise no SonarQube Cloud, rodada pelo GitHub Actions (.github/workflows/testes.yml).
# Chave e organização são as que o SonarQube Cloud cria ao importar o repositório do GitHub; confira em
# Project Information se forem diferentes.
sonar.projectKey=CalixtoNeto_angular-pokedex
sonar.organization=calixtoneto
sonar.projectName=Angular Pokédex

# Código de produção: app, libs e as regras de lint do projeto. Testes ficam de fora das fontes.
sonar.sources=src,libs,tools
sonar.exclusions=**/*.spec.ts,**/*.spec.mjs,libs/**/src/testing/**

# Testes: unitários (ao lado do código) e ponta a ponta.
sonar.tests=libs,tools,e2e
sonar.test.inclusions=**/*.spec.ts,**/*.spec.mjs,e2e/**

# Cobertura dos testes unitários, gerada por `npm run test:ci` (um relatório por lib).
sonar.javascript.lcov.reportPaths=\
  coverage/pokedex-domain/lcov.info,\
  coverage/pokedex-data-access/lcov.info,\
  coverage/pokedex-ui/lcov.info,\
  coverage/pokedex-ui-detail/lcov.info,\
  coverage/pokedex-feature-list/lcov.info,\
  coverage/pokedex-feature-detail/lcov.info

# Fora da conta de cobertura, como no nx.json: barrels (index.ts) e tipos das respostas da API.
# O app (src/) só compõe as libs e é coberto pelos testes ponta a ponta, que não geram lcov; as regras de
# lint (tools/) têm testes próprios, sem relatório de cobertura.
sonar.coverage.exclusions=**/index.ts,**/*.types.ts,src/**,tools/**

sonar.sourceEncoding=UTF-8
