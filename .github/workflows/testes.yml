name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: a Sonar usa o blame para saber o que é código novo.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (fronteiras entre libs e regras do projeto)
        run: npm run lint
      - name: Testes unitários com cobertura mínima por arquivo
        run: npm run test:ci
      # Sem o segredo (fork ou Sonar ainda não configurada), a análise é pulada em vez de falhar.
      - name: SonarQube Cloud configurado?
        id: sonar
        run: echo "configurado=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Análise do SonarQube Cloud (qualidade e cobertura)
        if: steps.sonar.outputs.configurado == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Falha o job se o Quality Gate reprovar o código novo.
          args: >
            -Dsonar.qualitygate.wait=true
      - name: Build de produção
        run: npm run build
      - name: Chromium para o Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes ponta a ponta (PokeAPI simulada)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
